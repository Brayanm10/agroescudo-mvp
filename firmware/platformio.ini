[platformio]
default_envs = node_lora_t3, node_field_t3, gateway_tbeam
src_dir = .

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
  sandeepmistry/LoRa@^0.8.0
  bblanchon/ArduinoJson@^7.2.1
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  adafruit/Adafruit SHT31 Library@^2.2.2
build_flags =
  -D AGRO_LORA_FREQUENCY=915E6
  -D AGRO_PROTOCOL_VERSION=4
  -D AGRO_SOIL_MOISTURE_PIN=32
  -D AGRO_ULTRASONIC_TRIG_PIN=32
  -D AGRO_ULTRASONIC_ECHO_PIN=33

[env:node_lora_t3]
board = ttgo-lora32-v1
build_flags =
  ${env.build_flags}
  -D AGRO_SENSOR_PROFILE=1
  -D AGRO_ENABLE_ULTRASONIC=1
build_src_filter =
  +<node_lora_t3/>
  +<shared/>
  -<gateway_tbeam/>
  -<arduino_ide/>

[env:node_field_t3]
board = ttgo-lora32-v1
build_flags =
  ${env.build_flags}
  -D AGRO_SENSOR_PROFILE=2
  -D AGRO_ENABLE_ULTRASONIC=0
build_src_filter =
  +<node_lora_t3/>
  +<shared/>
  -<gateway_tbeam/>
  -<arduino_ide/>

[env:gateway_tbeam]
board = ttgo-t-beam
lib_deps =
  sandeepmistry/LoRa@^0.8.0
  bblanchon/ArduinoJson@^7.2.1
build_src_filter =
  +<gateway_tbeam/>
  +<shared/>
  -<node_lora_t3/>
  -<arduino_ide/>

# Validation environments for the Arduino IDE deliverables. They are not part
# of default_envs because each sketch requires a local, gitignored secrets.h.
[env:arduino_silo_sensor_v4]
board = ttgo-lora32-v1
lib_extra_dirs = arduino_ide/libraries
build_src_filter =
  -<*>
  +<validation/arduino_silo_sensor_v4.cpp>

[env:arduino_campo_sensor_v4]
board = ttgo-lora32-v1
lib_extra_dirs = arduino_ide/libraries
build_src_filter =
  -<*>
  +<validation/arduino_campo_sensor_v4.cpp>

[env:arduino_gateway_multinodo_v4]
board = ttgo-t-beam
board_build.partitions = huge_app.csv
lib_extra_dirs = arduino_ide/libraries
lib_deps =
  sandeepmistry/LoRa@^0.8.0
  bblanchon/ArduinoJson@^7.2.1
  tzapu/WiFiManager@^2.0.17
  lewisxhe/XPowersLib@^0.3.0
build_src_filter =
  -<*>
  +<validation/arduino_gateway_multinodo_v4.cpp>

[env:arduino_sentinel_v02]
board = esp32dev
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit SSD1306@^2.5.13
build_src_filter =
  -<*>
  +<validation/arduino_sentinel_v02.cpp>
